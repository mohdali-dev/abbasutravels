<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Golden Orange Globe -->
  <circle cx="45" cy="52" r="30" fill="#f9a01b" />

  <!-- Clip-path for continents inside the globe -->
  <g clip-path="url(#globe-clip)">
    <!-- Continents -->
    <path d="M 22,32 C 24,30 28,29 32,32 C 34,34 31,37 36,36 C 39,35 41,39 37,44 C 33,48 25,46 22,42 Z" fill="#ffffff" />
    <path d="M 33,26 C 35,25 38,26 38,28 C 36,30 32,29 33,26 Z" fill="#ffffff" />
    <path d="M 37,45 C 41,43 47,45 49,49 C 51,52 46,56 44,61 C 42,66 36,65 36,59 C 36,54 33,48 37,45 Z" fill="#ffffff" />
    <path d="M 23,51 C 25,51 27,54 27,58 C 27,62 23,68 21,67 C 19,65 19,56 23,51 Z" fill="#ffffff" />
    <path d="M 50,36 C 54,36 58,39 56,43 C 54,47 61,49 59,54 C 56,58 53,54 50,49 Z" fill="#ffffff" />
  </g>

  <!-- Clip path definition -->
  <defs>
    <clipPath id="globe-clip">
      <circle cx="45" cy="52" r="30" />
    </clipPath>
  </defs>

  <!-- Back orbit swoosh -->
  <path d="M 40,75 C 50,77 59,70 61,58 C 63,48 59,40 56,36 C 57,39 59,47 57,56 C 55,64 48,70 40,75 Z" fill="#1d448a" />

  <!-- Main front orbit swoosh crossing diagonally -->
  <path d="M 38,72 C 22,77 9,70 7,58 C 5,46 16,40 31,43 C 46,46 66,35 82,19 L 85,22 C 69,39 48,49 32,46 C 18,43 10,48 11,56 C 13,64 24,71 38,72 Z" fill="#1d448a" />

  <!-- Airplane at the end of orbit -->
  <g transform="translate(81, 21) rotate(42)">
    <path d="M 0,-14 L 3,-4 L 14,-2 L 14,1 L 3,0 L 2,9 L 7,12 L 7,14 L 0,12 L -7,14 L -7,12 L -2,9 L -3,0 L -14,1 L -14,-2 L -3,-4 Z" fill="#1d448a" />
  </g>
</svg>
